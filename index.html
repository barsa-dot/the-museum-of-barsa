<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Museum of Barsa</title>
  <!-- Fonts: Cormorant Garamond (headings) and Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Intro screen ===== -->
  <section id="intro" class="intro" aria-labelledby="intro-title">
    <div class="intro__content">
      <h1 id="intro-title" class="intro__title">The Museum of Barsa</h1>
      <p class="intro__subtitle">A collection of things I've learned, created and discovered.</p>
      <button id="enter-button" class="button" type="button">Enter the Museum</button>
    </div>
  </section>

  <!-- ===== Entrance: dark passage =====
       Purely decorative, so it is hidden from screen readers. -->
  <section id="passage" class="scene passage" hidden aria-hidden="true">
    <div class="passage__arch"></div>
    <div class="passage__arch"></div>
    <div class="passage__arch"></div>
    <div class="passage__light"></div>
  </section>

  <!-- ===== Entrance: staircase descent ===== -->
  <section id="stairs" class="scene stairs" hidden aria-hidden="true">
    <div class="stairs__camera">
      <div class="stairs__glow"></div>
      <div class="stairs__flight"></div>
    </div>
  </section>

  <!-- ===== Entrance: monumental doors ===== -->
  <section id="doors" class="scene doors" hidden aria-hidden="true">
    <div class="doors__frame">
      <div class="doors__light"></div>
      <div class="doors__door doors__door--left"></div>
      <div class="doors__door doors__door--right"></div>
    </div>
  </section>

  <!-- Skip button: visible only while the entrance animation plays -->
  <button id="skip-button" class="skip-button" type="button" hidden>Skip</button>

  <!-- Grand Atrium will be built here. -->

  <script src="museum.js"></script>
</body>
</html>
