<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Museum of Barsa</title>
  <!-- Fonts: Cormorant Garamond (headings) and Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Grand Atrium =====
       The central hub. Each door is a link to a room page in rooms/. -->
  <main id="atrium" class="scene atrium">
    <header class="atrium__header">
      <p class="atrium__eyebrow">The Museum of Barsa</p>
      <h1 id="atrium-title" class="atrium__title" tabindex="-1">The Grand Atrium</h1>
      <p class="atrium__subtitle">Choose a door to begin.</p>
    </header>

    <nav class="atrium__nav" aria-label="Museum rooms">
      <ul class="atrium__doors">
        <li>
          <a class="atrium-door" data-transition href="rooms/library.html">
            <span class="atrium-door__arch" aria-hidden="true"></span>
            <span class="atrium-door__name">The Library</span>
            <span class="atrium-door__theme">Education</span>
          </a>
        </li>
        <li>
          <a class="atrium-door" data-transition href="rooms/creation-wing.html">
            <span class="atrium-door__arch" aria-hidden="true"></span>
            <span class="atrium-door__name">The Creation Wing</span>
            <span class="atrium-door__theme">Projects</span>
          </a>
        </li>
        <li>
          <a class="atrium-door" data-transition href="rooms/archive.html">
            <span class="atrium-door__arch" aria-hidden="true"></span>
            <span class="atrium-door__name">The Archive</span>
            <span class="atrium-door__theme">Experience</span>
          </a>
        </li>
        <li>
          <a class="atrium-door" data-transition href="rooms/workshop.html">
            <span class="atrium-door__arch" aria-hidden="true"></span>
            <span class="atrium-door__name">The Workshop</span>
            <span class="atrium-door__theme">Skills</span>
          </a>
        </li>
        <li>
          <a class="atrium-door" data-transition href="rooms/portrait-room.html">
            <span class="atrium-door__arch" aria-hidden="true"></span>
            <span class="atrium-door__name">The Portrait Room</span>
            <span class="atrium-door__theme">About</span>
          </a>
        </li>
        <li>
          <a class="atrium-door" data-transition href="rooms/courtyard.html">
            <span class="atrium-door__arch" aria-hidden="true"></span>
            <span class="atrium-door__name">The Courtyard</span>
            <span class="atrium-door__theme">Contact</span>
          </a>
        </li>
      </ul>
    </nav>
  </main>

  <script src="museum.js"></script>
</body>
</html>
