<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barsarani Sahoo — Portfolio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23141412'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23F4EAD8'%3EB%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Portfolio of Barsarani Sahoo, readable in a Developer mode or a Business mode with the same projects, education and experience."
    />
    <script>
      // Apply the visitor's mode before first paint so the page never flashes
      // the wrong colours. Mirrors resolveInitialMode() in src/state/mode.ts
      // (same "mode" URL parameter and "museum-mode" storage key; tested).
      (function () {
        var modes = ["developer", "business"];
        var mode = new URLSearchParams(location.search).get("mode");
        if (modes.indexOf(mode) < 0) {
          try {
            mode = localStorage.getItem("museum-mode");
          } catch (e) {
            mode = null;
          }
        }
        if (modes.indexOf(mode) >= 0) document.documentElement.setAttribute("data-mode", mode);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui, sans-serif">
        This portfolio needs JavaScript. Please enable it to view the content.
      </p>
    </noscript>
    <script type="module" src="/entry.ts"></script>
  </body>
</html>
